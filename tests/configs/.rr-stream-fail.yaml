version: '3'

rpc:
  listen: tcp://127.0.0.1:6064

server:
  command: "php php_test_files/psr-stream-fail.php"
  relay: "pipes"

http:
  address: 127.0.0.1:19993
  max_request_size: 1024
  middleware: ["gzip"]
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 2
    allocate_timeout: 60s
    destroy_timeout: 1s

logs:
  mode: development
  level: debug
