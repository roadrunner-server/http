version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php php_test_files/big-resp-worker.php"
  relay: "pipes"
  relay_timeout: "20s"

http:
  address: 127.0.0.1:16766
  max_request_size: 1
  middleware: ["gzip"]
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 2
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 1s

logs:
  mode: development
  level: error
