version: '3'

rpc:
  listen: tcp://127.0.0.1:6002

server:
  command: "php php_test_files/http/client.php echo pipes"

http:
  address: 127.0.0.1:10085
  max_request_size: 1
  middleware: []
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 2
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 1s
logs:
  mode: development
  level: error
