version: '3'

rpc:
  listen: tcp://[::1]:6003

server:
  command: "php php_test_files/http/client.php echo pipes"
  relay: "pipes"
  relay_timeout: "20s"

http:
  address: "[::1]:10784"
  max_request_size: 1024
  middleware: []
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 2
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 100ms
logs:
  mode: development
  level: error
