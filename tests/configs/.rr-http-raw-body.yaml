version: '3'

server:
  command: "php php_test_files/workers/raw-body.php"
  relay: "pipes"
  relay_timeout: "20s"

http:
  address: 127.0.0.1:22377
  max_request_size: 1024
  raw_body: true
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 2
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 100ms

logs:
  mode: development
  level: error
