version: '3'

rpc:
  listen: tcp://127.0.0.1:6064

server:
  command: "php php_test_files/streams/psr-103-http-code.php"
  relay: "pipes"

http:
  address: 127.0.0.1:19983
  max_request_size: 1024
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 1
    debug: true
    allocate_timeout: 60s
    destroy_timeout: 60s

logs:
  mode: development
  level: debug
