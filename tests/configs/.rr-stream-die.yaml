version: '3'

server:
  command: "php php_test_files/streams/stream-die.php"
  relay: "pipes"

http:
  address: 127.0.0.1:19973
  max_request_size: 1024
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 1
    allocate_timeout: 60s
    destroy_timeout: 100ms

logs:
  mode: development
  level: debug
