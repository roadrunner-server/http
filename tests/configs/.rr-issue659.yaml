version: '3'

rpc:
  listen: tcp://127.0.0.1:6009

server:
  command: "php php_test_files/workers/issue659.php"
  relay: "pipes"
  relay_timeout: "20s"

http:
  address: 127.0.0.1:32552
  max_request_size: 1024
  internal_error_code: 444
  middleware: []
  uploads:
    forbid: [".php", ".exe", ".bat"]
  pool:
    num_workers: 1
    destroy_timeout: 100ms

logs:
  mode: development
  level: panic
