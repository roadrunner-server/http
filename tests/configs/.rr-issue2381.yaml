version: "3"

rpc:
    listen: tcp://127.0.0.1:6066

server:
    command: "php php_test_files/workers/issue2381.php"
    relay: "pipes"
    relay_timeout: "20s"

http:
    address: 127.0.0.1:19984
    max_request_size: 1024
    middleware: []
    uploads:
        forbid: [".php", ".exe", ".bat"]
    pool:
        num_workers: 1
        destroy_timeout: 100ms

logs:
    mode: development
    level: panic
